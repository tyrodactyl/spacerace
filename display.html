<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Race Display</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050816; color: #e8ecff; font-family: Arial, Helvetica, sans-serif; }
  #sky { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(#050816 0%, #0b1440 55%, #1b2a6b 100%); }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .8; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  #top { position: absolute; top: 0; left: 0; right: 0; height: 9vh; display: flex; align-items: center; padding: 0 3vw; z-index: 5; }
  #top .l, #top .r { flex: 1; font-size: 2.4vh; letter-spacing: .18em; color: #9fb1ff; font-weight: 700; }
  #top .r { text-align: right; }
  #top .c { flex: 2; text-align: center; font-size: 4vh; font-weight: 800; letter-spacing: .22em; color: #fff; }

  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 17vh; background: linear-gradient(#2a2f4a, #14172b); border-top: .6vh solid #3a4170; }
  #pads { position: absolute; left: 2vw; right: 2vw; top: 10vh; bottom: 5vh; display: flex; align-items: flex-end; z-index: 3; }
  .pad { flex: 1; position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .rocketWrap { flex: 1; width: 100%; min-height: 0; padding: 0 .4vw; }
  .rocketWrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .plate { margin-top: 1vh; width: 88%; padding: 1vh .5vw; border-radius: 1vh; text-align: center; color: #fff; font-weight: 800; font-size: 2.6vh; letter-spacing: .06em;
           text-shadow: 0 1px 2px rgba(0,0,0,.5); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plate.bump { animation: bump .6s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 100% { transform: scale(1); } }

  .glow { opacity: 0; }
  .glow.flash { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 20% { opacity: .85; } 100% { opacity: 0; } }
  .beacon { animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }

  .float { position: absolute; left: 50%; top: 35%; transform: translateX(-50%); font-size: 2.8vh; font-weight: 800; color: #fff; white-space: nowrap; z-index: 6;
           text-shadow: 0 0 1vh rgba(0,0,0,.9), 0 0 2vh currentColor; animation: floatUp 1.8s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 2vh); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -12vh); } }

  #status { position: absolute; left: 1.5vw; bottom: 1vh; font-size: 1.8vh; color: #7f8cc0; z-index: 6; }
  #status i { display: inline-block; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #e74c3c; margin-right: .8vh; }
  #status.on i { background: #2ecc71; }
  #wait { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 4vh; color: #9fb1ff; z-index: 7; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="sky"></div>
<div id="top">
  <div class="l" id="periodLabel">PERIOD</div>
  <div class="c">SPACE RACE</div>
  <div class="r" id="weekLabel"></div>
</div>
<div id="pads"></div>
<div id="ground"></div>
<div id="status"><i></i><span>Connecting...</span></div>
<div id="wait">Waiting for mission control...</div>

<script>
(function () {
  var cfg = window.SR_CONFIG;
  var SYS = cfg.systemOrder;
  var STAGES = cfg.stages;
  var NS = 'http://www.w3.org/2000/svg';

  var q = new URLSearchParams(location.search);
  var period = parseInt(q.get('p'), 10);
  if (cfg.periods.indexOf(period) < 0) period = cfg.periods[0];
  document.getElementById('periodLabel').textContent = 'PERIOD ' + period;

  var state = { unit: 1, week: 1, tableCount: cfg.defaultTableCount };
  var build = {};
  var pads = [];
  var firstPing = true, lastPingN = null;

  // ---------- starfield ----------
  (function () {
    var sky = document.getElementById('sky'), i;
    for (i = 0; i < 70; i++) {
      var s = document.createElement('div'), size = 1 + Math.random() * 2.5;
      s.className = 'star';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 78) + '%';
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      sky.appendChild(s);
    }
  })();

  // ---------- rocket geometry (viewBox 0 -8 120 336) ----------
  // part bounds [top, bottom] used for the bottom-up build reveal
  var BOUNDS = { guidance: [24, 96], crew: [96, 166], fuel: [166, 236], engines: [232, 286] };

  function shape(sys, fill, color) {
    if (sys === 'guidance') {
      return '<path d="M60 24 C78 46 88 70 88 96 L32 96 C32 70 42 46 60 24 Z" fill="' + fill + '"/>' +
             '<rect x="32" y="88" width="56" height="8" fill="' + (fill === '#fff' ? '#fff' : '#e8edf8') + '"/>';
    }
    if (sys === 'crew') {
      return '<rect x="32" y="96" width="56" height="70" fill="' + fill + '"/>';
    }
    if (sys === 'fuel') {
      return '<rect x="32" y="166" width="56" height="70" fill="' + fill + '"/>' +
             '<rect x="32" y="182" width="56" height="5" fill="' + (fill === '#fff' ? '#fff' : color) + '"/>' +
             '<rect x="32" y="208" width="56" height="5" fill="' + (fill === '#fff' ? '#fff' : color) + '"/>';
    }
    // engines
    var f = (fill === '#fff') ? '#fff' : color, n = (fill === '#fff') ? '#fff' : '#7b87a8';
    return '<path d="M32 232 L10 284 L32 262 Z" fill="' + f + '"/>' +
           '<path d="M88 232 L110 284 L88 262 Z" fill="' + f + '"/>' +
           '<g fill="' + n + '">' +
           '<path class="nz nz0" d="M35 236 L45 236 L48 282 L32 282 Z"/>' +
           '<path class="nz nz1" d="M55 236 L65 236 L68 284 L52 284 Z"/>' +
           '<path class="nz nz2" d="M75 236 L85 236 L88 282 L72 282 Z"/></g>';
  }
  function scaffold(color) {
    return '<g fill="none" stroke="' + color + '" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 3">' +
      '<path d="M60 24 C78 46 88 70 88 96 L32 96 C32 70 42 46 60 24 Z"/>' +
      '<rect x="32" y="96" width="56" height="70"/><rect x="32" y="166" width="56" height="70"/>' +
      '<path d="M32 232 L10 284 L32 262 M88 232 L110 284 L88 262"/>' +
      '<path d="M35 236 L45 236 L48 282 L32 282 Z M55 236 L65 236 L68 284 L52 284 Z M75 236 L85 236 L88 282 L72 282 Z" stroke-opacity=".35"/></g>';
  }

  function makeRocket(i, svgEl) {
    var color = cfg.tables[i].color, uid = 'r' + i, html = '';
    html += '<defs>';
    SYS.forEach(function (sys) {
      html += '<clipPath id="clip-' + uid + '-' + sys + '"><rect class="clipRect" x="0" y="' + BOUNDS[sys][1] + '" width="120" height="0"/></clipPath>';
    });
    html += '</defs>';
    // launch pad
    html += '<rect x="12" y="290" width="96" height="7" rx="2" fill="#4a5280"/><rect x="22" y="297" width="6" height="14" fill="#3a4170"/><rect x="92" y="297" width="6" height="14" fill="#3a4170"/>';
    html += scaffold(color);
    SYS.forEach(function (sys) {
      var fill = sys === 'guidance' ? color : (sys === 'engines' ? '#7b87a8' : (sys === 'crew' ? '#e8edf8' : '#cfd8ee'));
      html += '<g class="part part-' + sys + '" clip-path="url(#clip-' + uid + '-' + sys + ')">' + shape(sys, fill, color) + '</g>';
    });
    // details that appear with stages
    html += '<g class="windows" clip-path="url(#clip-' + uid + '-crew)">';
    var wc = [[49, 118], [71, 118], [49, 146], [71, 146]];
    wc.forEach(function (c, k) { html += '<circle class="win win' + k + '" cx="' + c[0] + '" cy="' + c[1] + '" r="7" fill="#1a2147" stroke="#8da0d6" stroke-width="1.5" opacity="0"/>'; });
    html += '</g>';
    html += '<line class="antenna" x1="60" y1="24" x2="60" y2="6" stroke="#dfe6f5" stroke-width="2" opacity="0"/>';
    html += '<circle class="beacon" cx="60" cy="5" r="3.5" fill="#ff5a5a" style="display:none"/>';
    // flash overlays
    SYS.forEach(function (sys) {
      html += '<g class="glow glow-' + sys + '" clip-path="url(#clip-' + uid + '-' + sys + ')">' + shape(sys, '#fff', '#fff') + '</g>';
    });
    svgEl.innerHTML = html;
  }

  // ---------- pads ----------
  function buildPads() {
    var host = document.getElementById('pads');
    host.innerHTML = '';
    pads = [];
    for (var i = 0; i < state.tableCount; i++) {
      var pad = document.createElement('div'); pad.className = 'pad';
      var wrap = document.createElement('div'); wrap.className = 'rocketWrap';
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 -8 120 336');
      svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
      wrap.appendChild(svg);
      var plate = document.createElement('div'); plate.className = 'plate';
      plate.style.background = cfg.tables[i].color; plate.textContent = cfg.tables[i].name;
      pad.appendChild(wrap); pad.appendChild(plate); host.appendChild(pad);
      makeRocket(i, svg);
      pads.push({ el: pad, svg: svg, plate: plate });
    }
    applyBuild();
  }

  function stageOf(i, sys) {
    var t = build['t' + i];
    var v = t ? t[sys] : 0;
    v = Number(v) || 0;
    return Math.max(0, Math.min(STAGES, v));
  }
  function applyBuild() {
    for (var i = 0; i < pads.length; i++) {
      var svg = pads[i].svg, uid = 'r' + i;
      SYS.forEach(function (sys) {
        var frac = stageOf(i, sys) / STAGES, b = BOUNDS[sys], h = (b[1] - b[0]) * frac;
        var rect = svg.querySelector('#clip-' + uid + '-' + sys + ' .clipRect');
        rect.setAttribute('y', b[1] - h); rect.setAttribute('height', h);
      });
      // crew windows: 1 lit per 2 stages
      var lit = Math.ceil(stageOf(i, 'crew') / 2), k;
      for (k = 0; k < 4; k++) {
        var w = svg.querySelector('.win' + k);
        w.setAttribute('opacity', stageOf(i, 'crew') > 0 ? 1 : 0);
        w.setAttribute('fill', k < lit ? '#ffe66d' : '#1a2147');
      }
      // guidance extras
      var g = stageOf(i, 'guidance');
      svg.querySelector('.antenna').setAttribute('opacity', g >= STAGES ? 1 : 0);
      svg.querySelector('.beacon').style.display = g >= STAGES ? '' : 'none';
      // engines: nozzles appear at stages 1, 4, 7
      var e = stageOf(i, 'engines'), nz = [1, 4, 7], j;
      for (j = 0; j < 3; j++) {
        var ns = svg.querySelectorAll('.nz' + j), m;
        for (m = 0; m < ns.length; m++) ns[m].style.display = e >= nz[j] ? '' : 'none';
      }
    }
  }

  // ---------- award animation ----------
  function flash(el) {
    el.classList.remove('flash');
    void el.getBoundingClientRect(); // force reflow so the animation restarts
    el.classList.add('flash');
  }
  function onPing(p) {
    var i = p.t;
    if (i === undefined || i === null || !pads[i] || !cfg.systems[p.sys]) return;
    var pad = pads[i];
    flash(pad.svg.querySelector('.glow-' + p.sys));
    pad.plate.classList.remove('bump'); void pad.plate.getBoundingClientRect(); pad.plate.classList.add('bump');
    var f = document.createElement('div');
    f.className = 'float';
    f.style.color = cfg.tables[i].color;
    f.textContent = cfg.systems[p.sys].icon + ' ' + cfg.systems[p.sys].label.toUpperCase() + '!';
    pad.el.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1900);
  }

  // ---------- firebase ----------
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var db = firebase.database();
  var base = 'public/p' + period;
  var statusEl = document.getElementById('status');

  db.ref('.info/connected').on('value', function (s) {
    var on = s.val() === true;
    statusEl.className = on ? 'on' : '';
    statusEl.lastChild.textContent = on ? 'Live' : 'Reconnecting...';
  });

  db.ref(base + '/state').on('value', function (s) {
    var v = s.val();
    if (v) document.getElementById('wait').style.display = 'none';
    var count = (v && v.tableCount) || cfg.defaultTableCount;
    count = Math.max(1, Math.min(cfg.maxTables, count));
    var changed = !pads.length || count !== state.tableCount;
    state = { unit: (v && v.unit) || 1, week: (v && v.week) || 1, tableCount: count };
    document.getElementById('weekLabel').textContent = 'UNIT ' + state.unit + ' · WEEK ' + state.week;
    if (changed) buildPads();
  });
  db.ref(base + '/build').on('value', function (s) {
    build = s.val() || {};
    if (pads.length) applyBuild();
  });
  db.ref(base + '/ping').on('value', function (s) {
    var p = s.val();
    if (firstPing) { firstPing = false; lastPingN = p ? p.n : null; return; } // do not replay on page load
    if (!p || p.n === lastPingN) return;
    lastPingN = p.n;
    onPing(p);
  });

  buildPads();
})();
</script>
</body>
</html>
